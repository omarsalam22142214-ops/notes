<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق ملاحظاتي السري | النسخة الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary: #4361ee;
            --border-color: #ddd;
            --note-bg: #f8f9fa;
            --time-color: #888;
            --badge-bg: #2ec4b6;
            --pin-color: #ffb703;
            
            --note-red: #ffe5e5;
            --note-blue: #e5f0ff;
            --note-yellow: #fffde5;
            --note-green: #e5ffe5;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --text-color: #e4e6eb;
            --card-bg: #242526;
            --primary: #5c7cfa;
            --border-color: #3a3b3c;
            --note-bg: #3a3b3c;
            --time-color: #b0b3b8;
            --badge-bg: #20a094;
            --pin-color: #fb8500;
            
            --note-red: #4a2525;
            --note-blue: #25334a;
            --note-yellow: #4a4a25;
            --note-green: #254a25;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; justify-content: center; align-items: flex-start; 
            min-height: 100vh; padding: 20px; transition: 0.3s;
        }
        
        .container { 
            background: var(--card-bg); width: 100%; max-width: 1000px; 
            padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #loginScreen { text-align: center; max-width: 500px; margin: 0 auto; }
        #loginScreen input {
            width: 100%; padding: 12px; margin: 20px 0; border: 1px solid var(--border-color);
            border-radius: 8px; background: var(--bg-color); color: var(--text-color);
            text-align: center; font-size: 18px; outline: none;
        }
        #loginScreen input:focus { border-color: var(--primary); }

        #appScreen { display: none; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .header h1 { font-size: 24px; color: var(--primary); }

        .theme-btn {
            background: none; border: 2px solid var(--primary); color: var(--primary);
            padding: 5px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .theme-btn:hover { background: var(--primary); color: #fff; }

        .backup-tools { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .backup-btn {
            flex: 1; background: var(--note-bg); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s;
            min-width: 200px;
        }
        .backup-btn:hover { background: var(--border-color); }
        .backup-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .search-box { margin-bottom: 20px; }
        .search-box input {
            width: 100%; padding: 12px; border: 2px solid var(--primary); 
            border-radius: 8px; font-size: 16px; background: var(--bg-color); 
            color: var(--text-color); outline: none;
        }

        .input-section { max-width: 800px; margin: 0 auto; }

        .title-input {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); 
            border-radius: 8px; font-size: 18px; font-weight: bold;
            background: var(--bg-color); color: var(--text-color); outline: none;
            margin-bottom: 10px;
        }
        .title-input:focus { border-color: var(--primary); }

        textarea { 
            width: 100%; padding: 12px; border: 1px solid var(--border-color); 
            border-radius: 8px; font-size: 16px; resize: vertical;
            background: var(--bg-color); color: var(--text-color); outline: none;
            margin-bottom: 10px;
        }
        textarea:focus { border-color: var(--primary); }

        .color-palette { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .color-palette label { font-size: 14px; font-weight: bold; }
        .color-circle {
            width: 25px; height: 25px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s;
        }
        .color-circle:hover { transform: scale(1.1); }
        .color-circle.active { border-color: var(--primary); transform: scale(1.2); box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        
        .color-default { background-color: #ccc; }
        .color-red { background-color: #ff6b6b; }
        .color-blue { background-color: #4facfe; }
        .color-yellow { background-color: #f6e58d; }
        .color-green { background-color: #1dd1a1; }

        .media-tools { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .media-btn {
            background: var(--note-bg); color: var(--text-color); border: 1px solid var(--border-color);
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
            display: flex; align-items: center; gap: 5px; font-size: 14px;
        }
        .media-btn:hover { background: var(--border-color); }
        .media-btn.recording { background: #e63946; color: white; animation: pulse 1.5s infinite; border-color: #e63946; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .attachment-status { font-size: 12px; color: var(--primary); font-weight: bold; display: flex; gap: 10px; margin-bottom: 15px;}

        .score-container {
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px;
            background: var(--note-bg); padding: 10px 15px; border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .score-container label { font-weight: bold; white-space: nowrap; }
        input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--primary); }
        .score-value { font-weight: bold; color: var(--primary); min-width: 45px; }

        button.btn { 
            background: var(--primary); color: #fff; border: none; padding: 12px 20px; 
            border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; 
            width: 100%; transition: 0.3s; 
        }
        button.btn:hover { background: #3f37c9; }
        button.btn:disabled { background: #a0a0a0; cursor: not-allowed; }
        button.btn.edit-mode { background: #f4a261; }
        button.btn.edit-mode:hover { background: #e76f51; }

        ul { 
            list-style: none; 
            margin-top: 30px; 
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            align-items: start;
        }
        
        li { 
            background: var(--note-bg); padding: 15px; 
            border-radius: 8px; border-right: 4px solid var(--primary); 
            position: relative; cursor: pointer; /* غيرناها لـ pointer عشان تبان إنها بتنضغط */
            transition: opacity 0.2s, background-color 0.3s, transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            min-height: 200px; 
        }
        
        li:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        li[data-color="red"] { background-color: var(--note-red); }
        li[data-color="blue"] { background-color: var(--note-blue); }
        li[data-color="yellow"] { background-color: var(--note-yellow); }
        li[data-color="green"] { background-color: var(--note-green); }

        li.pinned-note { border-right-color: var(--pin-color); border-right-width: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}

        .note-title-display { font-size: 18px; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        
        .note-content { 
            white-space: pre-wrap; 
            margin-bottom: 10px; 
            line-height: 1.5; 
            max-height: 250px; 
            overflow-y: auto; 
            padding-left: 5px;
        }
        
        .note-content::-webkit-scrollbar { width: 5px; }
        .note-content::-webkit-scrollbar-track { background: transparent; }
        .note-content::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .note-image { max-width: 100%; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); display: block; object-fit: contain; max-height: 300px; }
        .note-audio { width: 100%; margin-bottom: 10px; outline: none; }

        .note-footer {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            font-size: 13px; color: var(--time-color); border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: auto; 
        }

        .note-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .score-badge { background-color: var(--badge-bg); color: white; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 12px; }
        .pin-badge { color: var(--pin-color); font-weight: bold; font-size: 14px; }

        .action-buttons { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px;}
        .action-buttons button {
            color: white; border: none; padding: 5px 10px; 
            border-radius: 5px; cursor: pointer; font-size: 12px; transition: 0.2s; flex: 1; text-align: center;
        }
        .delete-btn { background: #e63946; }
        .delete-btn:hover { background: #d62828; }
        .edit-btn { background: #f4a261; }
        .edit-btn:hover { background: #e76f51; }
        .pin-btn { background: #457b9d; }
        .pin-btn.active { background: var(--pin-color); }
        .copy-btn { background: #2a9d8f; }
        .copy-btn:hover { background: #21867a; }

        /* تنسيقات النافذة المنبثقة (Modal) الجديدة */
        .modal-overlay {
            display: none; /* مخفية افتراضياً */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); /* خلفية شفافة غامقة */
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%; max-width: 700px;
            border-radius: 15px; padding: 30px 30px 20px 30px;
            position: relative;
            max-height: 90vh; /* عشان لو الملاحظة عملاقة متطلعش بره الشاشة */
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transition: background-color 0.3s;
        }
        
        /* ألوان الـ Modal */
        .modal-content[data-color="red"] { background-color: var(--note-red); }
        .modal-content[data-color="blue"] { background-color: var(--note-blue); }
        .modal-content[data-color="yellow"] { background-color: var(--note-yellow); }
        .modal-content[data-color="green"] { background-color: var(--note-green); }

        .close-modal {
            position: absolute; top: 15px; left: 20px;
            font-size: 28px; cursor: pointer; color: var(--text-color);
            font-weight: bold; line-height: 1; transition: 0.2s;
        }
        .close-modal:hover { color: #e63946; transform: scale(1.1); }
        
        .modal-body .note-content { max-height: none; overflow-y: visible; font-size: 18px; } /* نلغي الحد الأقصى جوه الـ Modal */
        .modal-body .note-title-display { font-size: 24px; margin-bottom: 20px; }
        .modal-body .note-image { max-height: 500px; margin: 0 auto 20px auto; }
    </style>
</head>
<body>

    <div id="noteModal" class="modal-overlay">
        <div class="modal-content" id="modalCard">
            <span class="close-modal" id="closeModal">&times;</span>
            <div id="modalBody" class="modal-body">
                </div>
        </div>
    </div>

    <div class="container">
        <div id="loginScreen">
            <h1 style="color: var(--primary)">تسجيل الدخول</h1>
            <input type="password" id="passwordInput" placeholder="كلمة المرور هنا (12345)...">
            <button class="btn" id="loginBtn">دخول</button>
            <p id="errorMsg" style="color: red; margin-top: 10px; display: none;">كلمة المرور غير صحيحة!</p>
        </div>

        <div id="appScreen">
            <div class="header">
                <h1>ملاحظاتي السرية</h1>
                <button id="themeToggle" class="theme-btn">🌙 دارك مود</button>
            </div>
            
            <div class="backup-tools">
                <button class="backup-btn" id="exportBtn">📥 تصدير (Backup)</button>
                <button class="backup-btn" id="importBtn">📤 استيراد (Keep أو Backup)</button>
                <input type="file" id="importInput" accept=".json" multiple style="display: none;">
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ابحث في العناوين أو المحتوى...">
            </div>

            <div class="input-section">
                <input type="text" id="noteTitleInput" class="title-input" placeholder="عنوان الملاحظة (اختياري)...">
                <textarea id="noteInput" rows="4" placeholder="اكتب تفاصيل ملاحظتك هنا..."></textarea>
                
                <div class="color-palette">
                    <label>لون الملاحظة:</label>
                    <div class="color-circle color-default active" data-color="default" title="افتراضي"></div>
                    <div class="color-circle color-red" data-color="red" title="أحمر (مهم)"></div>
                    <div class="color-circle color-blue" data-color="blue" title="أزرق (عمل)"></div>
                    <div class="color-circle color-yellow" data-color="yellow" title="أصفر (أفكار)"></div>
                    <div class="color-circle color-green" data-color="green" title="أخضر (منجز)"></div>
                </div>

                <div class="media-tools">
                    <button class="media-btn" id="uploadImgBtn">📷 إضافة صورة</button>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button class="media-btn" id="recordAudioBtn">🎤 تسجيل صوتي</button>
                </div>
                <div class="attachment-status">
                    <span id="imgStatus"></span>
                    <span id="audioStatus"></span>
                </div>

                <div class="score-container">
                    <label for="scoreInput">تقييم الملاحظة:</label>
                    <input type="range" id="scoreInput" min="10" max="100" step="10" value="50">
                    <span class="score-value" id="scoreDisplay">50%</span>
                </div>

                <button class="btn" id="addBtn">إضافة الملاحظة</button>
            </div>

            <ul id="notesList"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref as dbRef, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtIkF-UhkeFa-cxutgJAQpR7K_IjKxloc",
            authDomain: "spygame-337ee.firebaseapp.com",
            databaseURL: "https://spygame-337ee-default-rtdb.firebaseio.com", 
            projectId: "spygame-337ee",
            storageBucket: "spygame-337ee.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);
        const notesRef = dbRef(db, 'secret_notes');

        const loginScreen = document.getElementById('loginScreen');
        const appScreen = document.getElementById('appScreen');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const themeToggle = document.getElementById('themeToggle');
        const searchInput = document.getElementById('searchInput');
        
        const noteTitleInput = document.getElementById('noteTitleInput');
        const noteInput = document.getElementById('noteInput');
        const scoreInput = document.getElementById('scoreInput');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const addBtn = document.getElementById('addBtn');
        const notesList = document.getElementById('notesList');
        
        const uploadImgBtn = document.getElementById('uploadImgBtn');
        const imageInput = document.getElementById('imageInput');
        const recordAudioBtn = document.getElementById('recordAudioBtn');
        const imgStatus = document.getElementById('imgStatus');
        const audioStatus = document.getElementById('audioStatus');

        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importInput = document.getElementById('importInput');

        // عناصر الـ Modal
        const noteModal = document.getElementById('noteModal');
        const modalCard = document.getElementById('modalCard');
        const closeModal = document.getElementById('closeModal');
        const modalBody = document.getElementById('modalBody');

        const SECRET_PASSWORD = "#ZMsd42d*";
        let editingNoteId = null;
        let draggedId = null;
        let draggedSortOrder = null;
        let selectedNoteColor = 'default';

        let selectedImageFile = null;
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let isRecording = false;

        // إغلاق النافذة المنبثقة
        closeModal.addEventListener('click', () => { noteModal.style.display = 'none'; });
        window.addEventListener('click', (e) => { 
            if(e.target === noteModal) noteModal.style.display = 'none'; 
        });

        const colorCircles = document.querySelectorAll('.color-circle');
        colorCircles.forEach(circle => {
            circle.addEventListener('click', (e) => {
                colorCircles.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedNoteColor = e.target.getAttribute('data-color');
            });
        });

        function resetColorPalette() {
            colorCircles.forEach(c => c.classList.remove('active'));
            document.querySelector('.color-circle[data-color="default"]').classList.add('active');
            selectedNoteColor = 'default';
        }

        loginBtn.addEventListener('click', () => {
            if (passwordInput.value === SECRET_PASSWORD) {
                loginScreen.style.display = 'none';
                appScreen.style.display = 'block';
                loadNotes();
            } else errorMsg.style.display = 'block';
        });
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') loginBtn.click(); });

        let isDark = localStorage.getItem('theme') === 'dark';
        if(isDark) document.documentElement.setAttribute('data-theme', 'dark');
        updateThemeBtn();
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeBtn();
        });
        function updateThemeBtn() { themeToggle.innerText = isDark ? '☀️ لايت مود' : '🌙 دارك مود'; }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            document.querySelectorAll('#notesList li').forEach(li => {
                const titleDiv = li.querySelector('.note-title-display');
                const contentDiv = li.querySelector('.note-content');
                const titleText = titleDiv ? titleDiv.innerText.toLowerCase() : '';
                const contentText = contentDiv ? contentDiv.innerText.toLowerCase() : '';
                li.style.display = (titleText.includes(searchTerm) || contentText.includes(searchTerm)) ? 'flex' : 'none';
            });
        });

        scoreInput.addEventListener('input', function() { scoreDisplay.innerText = this.value + '%'; });

        exportBtn.addEventListener('click', async () => {
            try {
                exportBtn.innerText = '⏳ جاري التصدير...';
                const snapshot = await get(notesRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const jsonString = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `notes_backup_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } else {
                    alert("مفيش ملاحظات لتصديرها حالياً!");
                }
            } catch (error) {
                alert("حصل خطأ أثناء التصدير.");
            } finally {
                exportBtn.innerText = '📥 تصدير (Backup)';
            }
        });

        importBtn.addEventListener('click', () => importInput.click());
        importInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;

            importBtn.innerText = '⏳ جاري الاستيراد...';
            importBtn.disabled = true;

            let importCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const text = await file.text();
                    const importedData = JSON.parse(text);

                    if (importedData.textContent !== undefined || importedData.listContent !== undefined) {
                        if (importedData.isTrashed) continue; 

                        let content = importedData.textContent || '';
                        if (importedData.listContent) {
                            content = importedData.listContent.map(item => (item.isChecked ? '✅ ' : '❌ ') + item.text).join('\n');
                        }

                        let color = 'default';
                        if(importedData.color === 'RED') color = 'red';
                        if(importedData.color === 'BLUE' || importedData.color === 'TEAL' || importedData.color === 'CERULEAN') color = 'blue';
                        if(importedData.color === 'YELLOW') color = 'yellow';
                        if(importedData.color === 'GREEN') color = 'green';

                        let dateString = new Date().toLocaleDateString('ar-EG');
                        let sortOrderValue = -new Date().getTime();
                        if (importedData.userEditedTimestampUsec) {
                            const keepDate = new Date(importedData.userEditedTimestampUsec / 1000);
                            dateString = `${keepDate.toLocaleDateString('ar-EG')} - الساعة ${keepDate.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
                            sortOrderValue = -(importedData.userEditedTimestampUsec / 1000);
                        }

                        await push(notesRef, {
                            title: importedData.title || '',
                            content: content,
                            timestamp: dateString,
                            score: 50, 
                            color: color,
                            isPinned: importedData.isPinned || false,
                            sortOrder: sortOrderValue,
                            imageUrl: null,
                            audioUrl: null
                        });
                        importCount++;
                    }
                    else {
                        let notesToImport = [];
                        if (Array.isArray(importedData)) notesToImport = importedData;
                        else if (typeof importedData === 'object') notesToImport = Object.values(importedData);

                        for (let note of notesToImport) {
                            await push(notesRef, {
                                title: note.title || '',
                                content: note.content || '',
                                timestamp: note.timestamp || new Date().toLocaleDateString('ar-EG'),
                                score: note.score || 50,
                                color: note.color || 'default',
                                isPinned: note.isPinned || false,
                                sortOrder: note.sortOrder || -new Date().getTime(),
                                imageUrl: note.imageUrl || null,
                                audioUrl: note.audioUrl || null
                            });
                            importCount++;
                        }
                    }
                } catch (err) {
                    console.error("متجاهل الملف ده عشان صيغته مش مفهومة:", file.name);
                }
            }

            if(importCount > 0) alert(`عاش! تم استيراد ${importCount} ملاحظة بنجاح.`);
            else alert("ملقيناش بيانات صالحة للاستيراد في الملفات دي.");
            
            importInput.value = '';
            importBtn.innerText = '📤 استيراد (Keep أو Backup)';
            importBtn.disabled = false;
        });

        uploadImgBtn.addEventListener('click', () => {
            if(!editingNoteId) imageInput.click();
            else alert("لا يمكن تغيير الصورة أثناء وضع التعديل.");
        });
        imageInput.addEventListener('change', (e) => {
            selectedImageFile = e.target.files[0];
            if(selectedImageFile) imgStatus.innerText = '✔️ تم إرفاق الصورة';
        });

        recordAudioBtn.addEventListener('click', async () => {
            if(editingNoteId) { alert("لا يمكن تسجيل صوت أثناء وضع التعديل."); return; }
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    isRecording = true;
                    recordAudioBtn.innerText = '🛑 إيقاف التسجيل';
                    recordAudioBtn.classList.add('recording');
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioStatus.innerText = '✔️ تم إرفاق تسجيل صوتي';
                    };
                } catch (err) { alert('يجب الموافقة على صلاحية المايكروفون!'); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordAudioBtn.innerText = '🎤 تسجيل صوتي';
                recordAudioBtn.classList.remove('recording');
            }
        });

        addBtn.addEventListener('click', async () => {
            const title = noteTitleInput.value.trim();
            const text = noteInput.value.trim();
            const scoreValue = scoreInput.value;

            if (title !== '' || text !== '' || selectedImageFile || recordedAudioBlob) {
                if (editingNoteId) {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    const dateString = now.toLocaleDateString('ar-EG');
                    
                    await update(dbRef(db, `secret_notes/${editingNoteId}`), {
                        title: title,
                        content: text,
                        score: scoreValue,
                        color: selectedNoteColor,
                        timestamp: `${dateString} - الساعة ${timeString} (مُعدلة)`
                    });
                    
                    editingNoteId = null;
                    addBtn.innerText = 'إضافة الملاحظة';
                    addBtn.classList.remove('edit-mode');
                } 
                else {
                    addBtn.innerText = '⏳ جاري الحفظ والرفع...';
                    addBtn.disabled = true;

                    let imageUrl = null;
                    let audioUrl = null;

                    if (selectedImageFile) {
                        const imgFileRef = storageRef(storage, `uploads/images/${Date.now()}_${selectedImageFile.name}`);
                        await uploadBytes(imgFileRef, selectedImageFile);
                        imageUrl = await getDownloadURL(imgFileRef);
                    }

                    if (recordedAudioBlob) {
                        const audioFileRef = storageRef(storage, `uploads/audio/record_${Date.now()}.webm`);
                        await uploadBytes(audioFileRef, recordedAudioBlob);
                        audioUrl = await getDownloadURL(audioFileRef);
                    }

                    const now = new Date();
                    const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    const dateString = now.toLocaleDateString('ar-EG');

                    await push(notesRef, {
                        title: title,
                        content: text,
                        timestamp: `${dateString} - الساعة ${timeString}`,
                        score: scoreValue, 
                        color: selectedNoteColor,
                        isPinned: false,
                        sortOrder: -now.getTime(),
                        imageUrl: imageUrl,
                        audioUrl: audioUrl
                    });
                    
                    addBtn.innerText = 'إضافة الملاحظة';
                    addBtn.disabled = false;
                }
                resetInputs();
            } else {
                alert("اكتب عنوان أو محتوى للملاحظة عشان تتحفظ!");
            }
        });

        function resetInputs() {
            noteTitleInput.value = ''; 
            noteInput.value = ''; 
            scoreInput.value = 50;
            scoreDisplay.innerText = '50%';
            selectedImageFile = null;
            recordedAudioBlob = null;
            imageInput.value = '';
            imgStatus.innerText = '';
            audioStatus.innerText = '';
            resetColorPalette();
        }

        // --- دالة فتح الـ Modal ---
        function openNoteModal(noteData) {
            // تظبيط لون النافذة
            if(noteData.color && noteData.color !== 'default') {
                modalCard.setAttribute('data-color', noteData.color);
            } else {
                modalCard.removeAttribute('data-color');
            }

            let mediaHTML = '';
            if (noteData.imageUrl) mediaHTML += `<img src="${noteData.imageUrl}" class="note-image" alt="مرفق صورة">`;
            if (noteData.audioUrl) mediaHTML += `<audio controls src="${noteData.audioUrl}" class="note-audio"></audio>`;

            const rawTitle = noteData.title || '';
            const rawContent = noteData.content || '';

            modalBody.innerHTML = `
                ${rawTitle ? `<div class="note-title-display">${escapeHTML(rawTitle)}</div>` : ''}
                ${mediaHTML}
                ${rawContent ? `<div class="note-content">${escapeHTML(rawContent)}</div>` : ''}
                <div class="note-meta" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color);">
                    <span>🕒 ${noteData.timestamp}</span>
                    <span class="score-badge">⭐ ${noteData.score ? noteData.score+'%' : 'بدون تقييم'}</span>
                </div>
            `;
            
            noteModal.style.display = 'flex';
        }

        function loadNotes() {
            onValue(notesRef, (snapshot) => {
                notesList.innerHTML = '';
                const data = snapshot.val();
                
                if (data) {
                    const notesArray = Object.keys(data).map(key => ({ id: key, ...data[key] }))
                    .sort((a, b) => {
                        if (a.isPinned && !b.isPinned) return -1;
                        if (!a.isPinned && b.isPinned) return 1;
                        return a.sortOrder - b.sortOrder;
                    });

                    notesArray.forEach(note => {
                        const li = document.createElement('li');
                        
                        if(note.isPinned) li.classList.add('pinned-note');
                        if(note.color && note.color !== 'default') {
                            li.setAttribute('data-color', note.color);
                        }
                        
                        li.draggable = true;
                        li.addEventListener('dragstart', function() { draggedId = note.id; draggedSortOrder = note.sortOrder; this.style.opacity = '0.5'; });
                        li.addEventListener('dragover', e => e.preventDefault());
                        li.addEventListener('drop', function(e) {
                            e.preventDefault();
                            this.style.opacity = '1';
                            if(draggedId && draggedId !== note.id) {
                                update(dbRef(db, `secret_notes/${draggedId}`), { sortOrder: note.sortOrder });
                                update(dbRef(db, `secret_notes/${note.id}`), { sortOrder: draggedSortOrder });
                            }
                        });
                        li.addEventListener('dragend', function() { this.style.opacity = '1'; });

                        // حدث فتح الـ Modal لما تضغط على الكارت
                        li.addEventListener('click', (e) => {
                            // بنقوله لو المستخدم ضغط على زرار من الزراير اللي تحت، متفتحش النافذة عشان ميحصلش تداخل
                            if(e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
                            
                            openNoteModal(note);
                        });

                        let mediaHTML = '';
                        if (note.imageUrl) mediaHTML += `<img src="${note.imageUrl}" class="note-image" alt="مرفق صورة">`;
                        if (note.audioUrl) mediaHTML += `<audio controls src="${note.audioUrl}" class="note-audio"></audio>`;

                        const rawTitle = note.title || '';
                        const rawContent = note.content || '';
                        const copyText = (rawTitle ? rawTitle + '\n\n' : '') + rawContent;

                        li.innerHTML = `
                            ${rawTitle ? `<div class="note-title-display">${escapeHTML(rawTitle)}</div>` : ''}
                            ${mediaHTML}
                            ${rawContent ? `<div class="note-content">${escapeHTML(rawContent)}</div>` : ''}
                            <div class="note-footer">
                                <div class="note-meta">
                                    <span>🕒 ${note.timestamp}</span>
                                    <span class="score-badge">⭐ ${note.score ? note.score+'%' : 'بدون تقييم'}</span>
                                    ${note.isPinned ? '<span class="pin-badge">📌 متثبتة</span>' : ''}
                                </div>
                                <div class="action-buttons">
                                    <button class="copy-btn" data-content="${escapeHTML(copyText)}">📋 نسخ</button>
                                    <button class="pin-btn ${note.isPinned ? 'active' : ''}" data-id="${note.id}" data-pinned="${note.isPinned || false}">${note.isPinned ? 'إلغاء التثبيت' : 'تثبيت'}</button>
                                    <button class="edit-btn" data-id="${note.id}" data-title="${escapeHTML(rawTitle)}" data-content="${escapeHTML(rawContent)}" data-score="${note.score || 50}" data-color="${note.color || 'default'}">تعديل</button>
                                    <button class="delete-btn" data-id="${note.id}">حذف</button>
                                </div>
                            </div>
                        `;
                        notesList.appendChild(li);
                    });

                    document.querySelectorAll('.copy-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const textToCopy = e.target.getAttribute('data-content');
                            if(textToCopy) {
                                navigator.clipboard.writeText(textToCopy).then(() => {
                                    const originalText = e.target.innerText;
                                    e.target.innerText = '✔️ تم النسخ';
                                    e.target.style.background = '#1dd1a1';
                                    setTimeout(() => {
                                        e.target.innerText = originalText;
                                        e.target.style.background = ''; 
                                    }, 2000);
                                }).catch(err => alert("حدث خطأ أثناء النسخ."));
                            } else {
                                alert("لا يوجد نص لنسخه!");
                            }
                        });
                    });

                    document.querySelectorAll('.pin-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            update(dbRef(db, `secret_notes/${e.target.dataset.id}`), { isPinned: !(e.target.dataset.pinned === 'true') });
                        });
                    });

                    document.querySelectorAll('.edit-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            editingNoteId = e.target.dataset.id;
                            
                            noteTitleInput.value = e.target.dataset.title !== 'undefined' ? e.target.dataset.title : '';
                            noteInput.value = e.target.dataset.content !== 'undefined' ? e.target.dataset.content : '';
                            
                            scoreInput.value = e.target.dataset.score;
                            scoreDisplay.innerText = scoreInput.value + '%';
                            
                            const savedColor = e.target.dataset.color;
                            colorCircles.forEach(c => c.classList.remove('active'));
                            document.querySelector(`.color-circle[data-color="${savedColor}"]`).classList.add('active');
                            selectedNoteColor = savedColor;
                            
                            addBtn.innerText = 'حفظ التعديلات';
                            addBtn.classList.add('edit-mode');
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });
                    });

                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const idToDel = e.target.dataset.id;
                            remove(dbRef(db, `secret_notes/${idToDel}`));
                            if(editingNoteId === idToDel) {
                                editingNoteId = null;
                                resetInputs();
                                addBtn.innerText = 'إضافة الملاحظة';
                                addBtn.classList.remove('edit-mode');
                            }
                        });
                    });
                }
            });
        }

        function escapeHTML(str) {
            if(!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }
    </script>
</body>
</html>
